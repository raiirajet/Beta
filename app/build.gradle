plugins {
    id 'com.android.application'
}

android {
    namespace 'ch.casamk.smarthome'
    compileSdk 36
    defaultConfig {
        applicationId 'ch.casamk.smarthome'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
